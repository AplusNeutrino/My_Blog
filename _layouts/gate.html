---
layout: compress
---

{% include origin-type.html %}
{% include lang.html %}

{% if site.theme_mode %}
  {% capture prefer_mode %}data-mode="{{ site.theme_mode }}"{% endcapture %}
{% endif %}

<!doctype html>
<html lang="{{ page.lang | default: site.alt_lang | default: site.lang }}" {{ prefer_mode }}>
  {% include head.html %}

  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#080b12">

  <link
    rel="stylesheet"
    href="{{ '/assets/css/gate.css' | relative_url }}?v={{ site.github.build_revision | default: site.time | date: '%Y%m%d%H%M%S' }}"
  >

  <body class="gate-body">
    {{ content }}

    <script
      src="{{ '/assets/js/gate.js' | relative_url }}?v={{ site.github.build_revision | default: site.time | date: '%Y%m%d%H%M%S' }}"
      defer
    ></script>
  </body>
</html>
