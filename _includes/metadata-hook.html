<!-- Custom metadata and site styling -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
{% include poe-night-mode.html %}
<link rel="stylesheet" href="{{ '/assets/css/NormaiNight.css' | relative_url }}?v={{ site.github.build_revision | default: site.time | date: '%Y%m%d%H%M%S' }}">
<link rel="stylesheet" href="{{ '/assets/css/ProsperoLight.css' | relative_url }}?v={{ site.github.build_revision | default: site.time | date: '%Y%m%d%H%M%S' }}">
{% if page.ravenis %}
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="{{ '/assets/css/ravenis.css' | relative_url }}?v={{ site.github.build_revision | default: site.time | date: '%Y%m%d%H%M%S' }}">
{% endif %}

{% unless site.pwa.enabled %}
  <script>
    (() => {
      if (!('serviceWorker' in navigator)) {
        return;
      }

      navigator.serviceWorker.getRegistrations()
        .then((registrations) => {
          if (registrations.length === 0) {
            return null;
          }

          return Promise.all(registrations.map((registration) => registration.unregister()));
        })
        .then((unregistered) => {
          if (!unregistered || !('caches' in window)) {
            return;
          }

          return caches.keys()
            .then((keys) => Promise.all(keys.map((key) => caches.delete(key))));
        })
        .catch(() => {});
    })();
  </script>
{% endunless %}

<script>
  (() => {
    const storageKey = 'neutriverse-sidebar-collapsed';
    const pageLayout = '{{ page.layout | default: layout.layout | default: "" | escape }}';
    const siteLogoUrl = '{{ "/assets/img/logo.png" | relative_url }}?v={{ site.github.build_revision | default: site.time | date: "%Y%m%d%H%M%S" }}';
    const desktopQuery = window.matchMedia('(min-width: 850px)');
    const safeStorage = {
      get(key) {
        try {
          return localStorage.getItem(key);
        } catch {
          return null;
        }
      },
      set(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch {
          /* Ignore storage failures in private or restricted browsers. */
        }
      }
    };

    const applySidebarState = (collapsed) => {
      document.body.classList.toggle('site-sidebar-collapsed', collapsed);
    };

    const getAutomaticSidebarState = () => {
      if (!desktopQuery.matches) {
        return null;
      }

      if (pageLayout === 'post') {
        return true;
      }

      if (pageLayout === 'home') {
        return false;
      }

      return null;
    };

    const applyStoredOrAutomaticSidebarState = () => {
      const automaticState = getAutomaticSidebarState();
      if (automaticState !== null) {
        safeStorage.set(storageKey, automaticState ? 'true' : 'false');
        applySidebarState(automaticState);
        return;
      }

      applySidebarState(safeStorage.get(storageKey) === 'true');
    };

    const spin = (element) => {
      element.classList.remove('site-logo-spinning', 'is-spinning');
      void element.offsetWidth;
      element.classList.add(element.id === 'avatar' ? 'site-logo-spinning' : 'is-spinning');
      window.setTimeout(() => {
        element.classList.remove('site-logo-spinning', 'is-spinning');
      }, 760);
    };

    document.addEventListener('DOMContentLoaded', () => {
      const avatar = document.getElementById('avatar');
      const sidebar = document.getElementById('sidebar');
      const avatarImage = avatar?.querySelector('img');

      if (avatarImage) {
        avatarImage.src = siteLogoUrl;
      }

      if (!avatar || !sidebar) {
        return;
      }

      const recall = document.createElement('button');
      recall.type = 'button';
      recall.className = 'site-sidebar-recall';
      recall.setAttribute('aria-label', '展开左侧栏');
      recall.innerHTML = `<img src="${siteLogoUrl}" alt="">`;
      document.body.appendChild(recall);

      applyStoredOrAutomaticSidebarState();
      window.addEventListener('pageshow', applyStoredOrAutomaticSidebarState);

      avatar.addEventListener('click', (event) => {
        if (!desktopQuery.matches) {
          return;
        }

        event.preventDefault();
        spin(avatar);
        safeStorage.set(storageKey, 'true');
        applySidebarState(true);
      });

      recall.addEventListener('click', () => {
        spin(recall);
        safeStorage.set(storageKey, 'false');
        applySidebarState(false);
      });
    });
  })();
</script>
