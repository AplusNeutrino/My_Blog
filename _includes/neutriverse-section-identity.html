{% assign nv_identity_id = include.current | default: page.section_id %}
{% assign nv_identity = site.data.neutriverse_sections.sections | where: 'id', nv_identity_id | first %}
<header
  class="nv-section-identity"
  data-section-identity="{{ nv_identity_id }}"
  aria-labelledby="nv-section-title-{{ nv_identity_id }}"
>
  <div class="nv-section-identity-copy">
    <p class="nv-section-kicker">{{ nv_identity.name }}</p>
    <h1 id="nv-section-title-{{ nv_identity_id }}">{{ nv_identity.label_zh }}</h1>
    <p class="nv-section-summary">{{ nv_identity.summary }}</p>
  </div>
</header>
