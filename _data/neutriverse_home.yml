# Single source of truth for homepage structure and editorial choices.
schema_version: 1

section_order:
  - identity
  - latest_transmissions
  - featured
  - current_signal
  - system_status

identity:
  source: public_site_identity
  kicker: A PERSONAL COMMONPLACE BOOK
  title: 中间层
  english_title: NEUTRIVERSE
  owner: Neutrino
  summary: 这里存放笔记、读后感和记忆碎片，也记录正在制作的工具与持续观察的事物。
  welcome: 欢迎所有的你。

latest_transmissions:
  order: date_desc
  primary_source: visible_posts
  fragment_source: thoughts.fragments
  project_log_relation: project
  hidden_policy: exclude
  limit: 5

current_signal:
  title: 目前正在整理这个网站
  summary: 这里将持续整理写作、项目与观察记录。
  url: /about/
  source: approved_master_plan

featured:
  posts:
    - /posts/%E4%B8%BA%E4%BB%80%E4%B9%88%E6%88%91%E8%A6%81%E8%B7%B3%E8%BF%87FF2/
    - /posts/FF1%E8%AE%B0%E5%BD%95/
  fallback_sources:
    - home_popular.posts
    - latest_visible_posts
  hidden_policy: exclude
  limit: 3

system_status:
  source: public_content
  post_scope: visible_posts
  project_source: future_project_catalog
  latest_update_source: visible_content

project_logs:
  - url: /posts/%E9%98%BF%E5%8D%A1%E5%A4%8F%E4%BE%BF%E7%AC%BAakashanotes/
    project: Akasha Notes
  - url: /posts/%E4%B8%B0%E8%81%AA%E8%80%B3%E6%9C%BAtoyosatomimisheadphone/
    project: Toyosatomimi's Headphone
