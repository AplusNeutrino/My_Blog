name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
      - 'ui/**'
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  repository_dispatch:
    types: [ravenis-history-published]

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore last-known-good Ravenis data
        id: ravenis-cache
        uses: actions/cache/restore@v4
        with:
          path: _ravenis_lkg
          key: ravenis-lkg-${{ github.sha }}
          restore-keys: |
            ravenis-lkg-

      - name: Install Chinese fonts for visual evidence
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install browser, baseline, and Ravenis test dependencies
        run: python -m pip install boto3 PyYAML selenium

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Validate render-only legacy table boundaries
        run: bundle exec ruby tests/test_markdown_table_boundaries.rb

      - name: Validate protected restructure baseline
        run: >-
          python tools/content_restructure_baseline.py
          --output "${{ runner.temp }}/neutriverse-current.json"
          --check-against docs/neutriverse-restructure-baseline.json

      - name: Validate authoring sources
        run: python tools/check_authoring.py

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      - name: Validate Search and Atom feed
        run: python tools/check_search_feed.py "_site${{ steps.pages.outputs.base_path }}"

      - name: Validate SEO, sitemap, redirects, and internal routes
        run: python tools/check_seo_routes.py "_site${{ steps.pages.outputs.base_path }}"

      - name: Validate resource scope and integration fallbacks
        run: python tools/check_performance_integrations.py "_site${{ steps.pages.outputs.base_path }}"

      - name: Validate mobile sidebar in Chrome
        run: python tools/check_mobile_sidebar.py "_site${{ steps.pages.outputs.base_path }}"

      - name: Validate responsive accessibility matrix in Chrome
        run: python tools/check_responsive_accessibility.py "_site${{ steps.pages.outputs.base_path }}"
        env:
          UI_SCREENSHOT_DIR: ${{ runner.temp }}/neutriverse-ui-screenshots

      - name: Upload public navigation visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neutriverse-navigation-${{ github.sha }}
          path: ${{ runner.temp }}/neutriverse-ui-screenshots
          if-no-files-found: ignore
          retention-days: 14

      - name: Check THINK and BUILD visual states
        run: python tools/check_think_build_visual.py "_site${{ steps.pages.outputs.base_path }}"
        env:
          UI_AUDIT_DIR: ${{ runner.temp }}/neutriverse-think-build-audit

      - name: Upload public THINK and BUILD visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neutriverse-think-build-${{ github.sha }}
          path: ${{ runner.temp }}/neutriverse-think-build-audit
          if-no-files-found: ignore
          retention-days: 14

      # Keep the complete evidence archive; this additional lossless scope stays
      # independently downloadable when the combined UI archive grows large.
      - name: Upload THINK pagination visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neutriverse-think-pagination-${{ github.sha }}
          path: |
            ${{ runner.temp }}/neutriverse-think-build-audit/public-sweep-think-page-*.png
            ${{ runner.temp }}/neutriverse-think-build-audit/public-sweep-think-page-*.json
            ${{ runner.temp }}/neutriverse-think-build-audit/public-top-think-page-*.png
            ${{ runner.temp }}/neutriverse-think-build-audit/think-pagination-*.json
            ${{ runner.temp }}/neutriverse-think-build-audit/think-pagination-*.png
            ${{ runner.temp }}/neutriverse-think-build-audit/audit.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Fetch verified Ravenis public release
        id: ravenis
        env:
          RAVENIS_R2_BUCKET: ${{ secrets.RAVENIS_R2_BUCKET }}
          RAVENIS_R2_ACCESS_KEY_ID: ${{ secrets.RAVENIS_R2_ACCESS_KEY_ID }}
          RAVENIS_R2_SECRET_ACCESS_KEY: ${{ secrets.RAVENIS_R2_SECRET_ACCESS_KEY }}
          RAVENIS_R2_ENDPOINT: ${{ secrets.RAVENIS_R2_ENDPOINT }}
          RAVENIS_R2_REGION: ${{ secrets.RAVENIS_R2_REGION }}
          ALLOW_RAVENIS_LKG: ${{ github.event_name == 'repository_dispatch' && '0' || '1' }}
        run: |
          args=()
          if [ "$ALLOW_RAVENIS_LKG" = "1" ]; then
            args+=(--allow-lkg)
          fi
          python tools/fetch_ravenis_release.py \
            --target "_site${{ steps.pages.outputs.base_path }}/ravenis/data" \
            --lkg _ravenis_lkg \
            "${args[@]}"

      - name: Save verified Ravenis release
        if: steps.ravenis.outputs.source == 'remote'
        uses: actions/cache/save@v4
        with:
          path: _ravenis_lkg
          key: ravenis-lkg-${{ steps.ravenis.outputs.release_sha }}

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  verify-live-ui:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install live browser audit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install selenium PyYAML
      - name: Verify deployed THINK and BUILD UI
        env:
          UI_LIVE_BASE: https://neutriverse.uk
          UI_AUDIT_DIR: ${{ runner.temp }}/neutriverse-live-ui
        run: python tools/check_think_build_visual.py .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neutriverse-live-ui-${{ github.sha }}
          path: ${{ runner.temp }}/neutriverse-live-ui
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload deployed THINK pagination visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neutriverse-live-think-pagination-${{ github.sha }}
          path: |
            ${{ runner.temp }}/neutriverse-live-ui/public-sweep-think-page-*.png
            ${{ runner.temp }}/neutriverse-live-ui/public-sweep-think-page-*.json
            ${{ runner.temp }}/neutriverse-live-ui/public-top-think-page-*.png
            ${{ runner.temp }}/neutriverse-live-ui/think-pagination-*.json
            ${{ runner.temp }}/neutriverse-live-ui/think-pagination-*.png
            ${{ runner.temp }}/neutriverse-live-ui/audit.json
          if-no-files-found: ignore
          retention-days: 14

