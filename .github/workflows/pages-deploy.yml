name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  repository_dispatch:
    types: [ravenis-history-published]

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore last-known-good Ravenis data
        id: ravenis-cache
        uses: actions/cache/restore@v4
        with:
          path: _ravenis_lkg
          key: ravenis-lkg-${{ github.sha }}
          restore-keys: |
            ravenis-lkg-

      - name: Install Ravenis reader dependency
        run: python -m pip install boto3

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      - name: Fetch verified Ravenis public release
        id: ravenis
        env:
          RAVENIS_R2_BUCKET: ${{ secrets.RAVENIS_R2_BUCKET }}
          RAVENIS_R2_ACCESS_KEY_ID: ${{ secrets.RAVENIS_R2_ACCESS_KEY_ID }}
          RAVENIS_R2_SECRET_ACCESS_KEY: ${{ secrets.RAVENIS_R2_SECRET_ACCESS_KEY }}
          RAVENIS_R2_ENDPOINT: ${{ secrets.RAVENIS_R2_ENDPOINT }}
          RAVENIS_R2_REGION: ${{ secrets.RAVENIS_R2_REGION }}
          ALLOW_RAVENIS_LKG: ${{ github.event_name == 'repository_dispatch' && '0' || '1' }}
        run: |
          args=()
          if [ "$ALLOW_RAVENIS_LKG" = "1" ]; then
            args+=(--allow-lkg)
          fi
          python tools/fetch_ravenis_release.py \
            --target "_site${{ steps.pages.outputs.base_path }}/ravenis/data" \
            --lkg _ravenis_lkg \
            "${args[@]}"

      - name: Save verified Ravenis release
        if: steps.ravenis.outputs.source == 'remote'
        uses: actions/cache/save@v4
        with:
          path: _ravenis_lkg
          key: ravenis-lkg-${{ steps.ravenis.outputs.release_sha }}

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
