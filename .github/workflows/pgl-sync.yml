name: "PGL Sync"

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *" # 02:17 Asia/Shanghai (UTC+8)

permissions:
  actions: write
  contents: write

concurrency:
  group: "pgl-sync"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync Prospero Great Library
        uses: AplusNeutrino/Prospero_Great_Library@115c7f2573033170d7ab72f0b3c18958899cb5dd
        env:
          BANGUMI_ACCESS_TOKEN: ${{ secrets.BANGUMI_ACCESS_TOKEN }}
          NEODB_ACCESS_TOKEN: ${{ secrets.NEODB_ACCESS_TOKEN }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}

      - name: Persist generated library state
        id: persist
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- _data/prospero_great_library assets/data/prospero_great_library)" ]; then
            echo "No PGL data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/prospero_great_library assets/data/prospero_great_library
          git commit -m "chore(pgl): sync personal library [$(date -u +%F)]"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy updated library
        if: steps.persist.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages-deploy.yml --ref main
