name: "PGL Integration Check"

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --destination _site
        env:
          JEKYLL_ENV: production

      - name: Verify PGL output
        shell: bash
        run: |
          test -f _site/library/index.html
          test -f _site/assets/pgl/pgl.css
          test -f _site/assets/pgl/pgl-chirpy.css
          test -f _site/assets/pgl/pgl.js
